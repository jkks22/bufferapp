# fly.toml — configuración para deploy en Fly.io
# Docs: https://fly.io/docs/reference/configuration/
# Para desplegar: flyctl launch (primera vez) o flyctl deploy (actualizaciones)

app = "bufferapp"
primary_region = "mia"  # Miami — buena latencia para México/LATAM

[build]
  dockerfile = "Containerfile"

[env]
  NODE_ENV = "production"
  PORT     = "3001"

[[mounts]]
  source      = "bufferapp_data"
  destination = "/app/server/data"

[http_service]
  internal_port        = 3001
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period  = "10s"
    interval      = "30s"
    method        = "GET"
    path          = "/api/health"
    timeout       = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
