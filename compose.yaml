name: bufferapp

services:
  app:
    build:
      context: .
      dockerfile: Containerfile
      # Usa formato docker para que HEALTHCHECK funcione en Podman
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: bufferapp:latest
    container_name: bufferapp
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /app/server/data/data.sqlite
      # Descomenta y rellena en producción:
      # CORS_ORIGIN: https://tudominio.com
    volumes:
      - bufferapp-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  bufferapp-data:
